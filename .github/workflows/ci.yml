name: CI

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+-r[0-9]+']
  pull_request:
    branches: [main, codex/desktop-packaging]

# 避免同一分支重复并发导致资源争用；新提交会取消旧运行
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

# 默认 shell，避免每步重复指定
defaults:
  run:
    shell: bash

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests

      - name: Pytest
        run: pytest -v -x

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 核对发布标签与桌面应用版本
        if: github.ref_type == 'tag'
        run: |
          version=$(jq -er '.version' frontend/package.json)
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ || "${GITHUB_REF_NAME%-r*}" != "v$version" ]]; then
            echo "::error::发布标签必须为 vX.Y.Z-rN，且 X.Y.Z 必须等于桌面应用版本 $version"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        if: github.ref_type == 'tag'
        working-directory: frontend
        run: npm run build

      - name: Frontend tests
        working-directory: frontend
        run: npm test

  desktop:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [backend, frontend]
    uses: ./.github/workflows/desktop-build.yml
    with:
      upload-artifacts: true

  release:
    needs: desktop
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ZFundPilot-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: 发布桌面安装包
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          windows=(release-assets/*-setup.exe)
          deb=(release-assets/deb/*.deb)
          appimage=(release-assets/appimage/*.AppImage)
          if (( ${#windows[@]} != 1 || ${#deb[@]} != 1 || ${#appimage[@]} != 1 )); then
            echo "::error::发布需要一个 Windows 安装包、一个 deb 和一个 AppImage"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${windows[@]}" "${deb[@]}" "${appimage[@]}" \
            --verify-tag --generate-notes
