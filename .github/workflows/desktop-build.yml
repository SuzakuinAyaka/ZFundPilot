name: Windows 桌面包

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: 配置 Rust
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc
      - name: 安装后端构建依赖
        shell: pwsh
        run: python -m pip install -e . pyinstaller==6.22.3
      - name: 构建并验证 Windows 安装包
        shell: pwsh
        run: ./desktop/build.ps1
      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: ZFundPilot-windows-x64-${{ github.sha }}
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
